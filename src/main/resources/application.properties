spring.application.name=library

# порт от mysql я ставил стандартный (3306)
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Europe/Moscow

# я оставлял пароль по умолчанию, если у вас другой пароль от БД - поменяйте
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false
